[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-recognition"
version = "1.0.0rc3"
description = "Real-time isolated Indian Sign Language recognition application layer"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
